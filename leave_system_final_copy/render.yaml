services:
  - type: web
    name: leave-management
    plan: free
    runtime: python
    buildCommand: bash leave_system_final_copy/build.sh
    startCommand: cd leave_system_final_copy && gunicorn leave_management.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leave-management-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,127.0.0.1,localhost"
      - key: TIME_ZONE
        value: Asia/Thimphu
      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  - name: leave-management-db
    plan: free
    databaseName: leave_management
    user: leave_management
